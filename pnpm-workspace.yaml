packages:
  - 'packages/*'
  - 'plugins/*'

# Supply-chain policy. A version must be at least a day old before pnpm
# installs it: the recent npm worms were pulled within hours of publishing.
minimumReleaseAge: 1440
# Never accept a dependency whose publishing trust level went down.
trustPolicy: no-downgrade
# undici-types 6.21.0 is the version @types/node 22 pins (pulled in through
# @anthropic-ai/mcpb's prompts); a later release of it was published with
# lower trust metadata, which the policy reads as a downgrade of this one.
trustPolicyExclude:
  - undici-types@6.21.0
# Transitive dependencies only from the registry, never git or tarball URLs.
blockExoticSubdeps: true

# pnpm 12 refuses to run a dependency's install scripts unless it is listed here.
allowBuilds:
  lefthook: true
  # msw's postinstall only refreshes browser service-worker copies; our tests
  # run in Node and never use one.
  msw: false
