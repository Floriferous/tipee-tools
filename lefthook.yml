# Pre-commit: apply the fixers and rebuild the plugin bundle, restage what
# They rewrote, then run the checks that have no fixer. CI runs
# `pnpm verify` instead, which only checks.
pre-commit:
  commands:
    fix:
      priority: 1
      run: pnpm fix
      stage_fixed: true
    check:
      priority: 2
      run: pnpm check && pnpm test
