# Pre-commit: apply the fixers and rebuild the plugin bundle, restage what
# They rewrote, then run the cached checks. CI runs `pnpm verify` instead,
# Which only checks.
pre-commit:
  commands:
    fix:
      priority: 1
      run: pnpm fix
      stage_fixed: true
    check:
      priority: 2
      run: pnpm exec turbo run check test
