# Dependabot keeps the GitHub Actions current. npm dependencies are handled
# By Renovate (renovate.json): Dependabot's updater cannot download pnpm 12's
# Native binary inside its sandbox, so its npm jobs fail.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
