name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# One run per branch: a new push cancels the previous run of the same ref.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Optional Vercel Remote Cache; without these, the .turbo cache below applies.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No version pinned here on purpose: the action reads the `packageManager`
      # Field in package.json, so the version only has to be bumped in one place.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version

      # Turborepo's local cache, keyed by commit and restored from the most
      # Recent run, so unchanged packages skip their tasks.
      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same command as the pre-commit hook's check step and as local `pnpm
      # Verify`: lint, format, type-check, tests, bundle, then the bundle
      # Freshness check (the committed plugin server must match the sources).
      - name: Verify
        run: pnpm verify

      # The Claude Desktop extension built by `pnpm verify`, downloadable from
      # The run for manual installs until releases are automated.
      - name: Upload the Claude Desktop extension
        uses: actions/upload-artifact@v7
        with:
          name: tipee-mcpb
          path: plugins/tipee/dist/*.mcpb
          if-no-files-found: error
