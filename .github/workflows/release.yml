name: Release

# Pushing a tag such as v0.2.1 builds the extension and publishes it on a
# GitHub Release under two names: the versioned file, and tipee.mcpb, which
# the README's "latest" link resolves to, plus their SHA256SUMS.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The update tool downloads v<version>/tipee-<version>.mcpb, named from
      # SERVER_VERSION: a tag that differs would publish a release it cannot find.
      - name: Check the tag against the version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          server=$(sed -nE "s/^export const SERVER_VERSION = '([^']+)';/\1/p" packages/mcp/src/Server.ts)
          plugin=$(node -p "require('./plugins/tipee/.claude-plugin/plugin.json').version")
          if [ "$tag" != "$server" ] || [ "$tag" != "$plugin" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match SERVER_VERSION ($server) and plugin.json ($plugin)"
            exit 1
          fi

      - name: Build the extension
        run: pnpm exec turbo run pack

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file=$(ls plugins/tipee/dist/*.mcpb)
          cp "$file" plugins/tipee/dist/tipee.mcpb
          # The plugin's update tool verifies the bundle against these.
          (cd plugins/tipee/dist && sha256sum tipee-*.mcpb tipee.mcpb > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" "$file" plugins/tipee/dist/tipee.mcpb plugins/tipee/dist/SHA256SUMS \
            --title "Tipee for Claude ${GITHUB_REF_NAME#v}" \
            --generate-notes
