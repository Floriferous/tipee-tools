name: Spec refresh

# Every Monday morning (UTC), brings Tipee's OpenAPI document up to date with
# `pnpm spec:refresh` and, when anything changed, opens or updates one PR with
# the summary as its body and the version bumped. That PR is the alert: review
# the summary and the diff, and merge, which releases it. A broken run is
# reported by GitHub's failure email.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-refresh
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  refresh:
    name: Refresh the Tipee API document
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A PR opened with GITHUB_TOKEN triggers no workflow, so Verify would
      # never run on it. A fine-grained token on this repository only pushes
      # and opens the PR instead: contents and pull requests write, plus issues
      # write for the needs-major label.
      - name: Check the token
        env:
          SPEC_REFRESH_TOKEN: ${{ secrets.SPEC_REFRESH_TOKEN }}
        run: |
          if [ -z "$SPEC_REFRESH_TOKEN" ]; then
            echo "::error::The SPEC_REFRESH_TOKEN secret is missing. Add a fine-grained token with contents, pull requests and issues write on this repository, so that Verify runs on the refresh PR."
            exit 1
          fi

      # No credentials in .git/config while the install and the refresh run
      # third-party code: git gets the token only to push, in the last step.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Minor when operations were added, patch otherwise; a removed or
      # renamed operation gets the needs-major label for a person to decide.
      - name: Refresh the document
        run: pnpm spec:refresh --bump --report "$RUNNER_TEMP/refresh.json"

      # A new stable version gets a PR of its own (spec-move-<version>);
      # changes within the pinned version share the spec-refresh branch. Each
      # run rebuilds the branch from main, so the PR always holds one commit.
      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ secrets.SPEC_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/refresh.json"
          if [ "$(jq -r .changed "$report")" != true ]; then
            echo "Tipee's document has not changed."
            # Tipee may have reverted what an earlier run proposed: that PR
            # would now replace main's document with a superseded one.
            stale=$(gh pr list --head spec-refresh --state open --json number --jq '.[0].number // empty')
            if [ -n "$stale" ]; then
              gh pr close "$stale" --delete-branch --comment "Tipee's document matches main again: nothing to refresh."
            fi
            exit 0
          fi
          branch=$(jq -r .branch "$report")
          title=$(jq -r .title "$report")
          jq -r .body "$report" > "$RUNNER_TEMP/body.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --force-create "$branch"
          git add --all
          git commit --message "$title" --message "Opened by the spec-refresh workflow: pnpm spec:refresh --bump."
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$branch"
          number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
          if [ "$(jq -r .needs_major "$report")" = true ]; then
            gh label create needs-major --color B60205 --description 'Removes or renames a tool: needs a major version' --force
            gh pr edit "$branch" --add-label needs-major
          else
            # A later run may find the operation back: the label must go too.
            gh pr edit "$branch" --remove-label needs-major 2>/dev/null || true
          fi
